<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Streamhub Studio</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">Streamhub <b>Studio</b><span>PLUGIN</span></div><div class="workspace-name">▦ 작업 공간</div><div class="connection"><i></i><span id="runtime">Runtime 확인 중</span></div><span id="state">불러오는 중</span><button id="undo">↶</button><button id="redo">↷</button><button id="apply" class="primary" disabled>장치에 적용</button></header>
<div id="error" role="alert" hidden></div><main><aside class="sidebar"><div class="aside-title"><span>화면</span><button id="add-page">＋</button></div><nav id="pages"></nav><button id="standby" class="page-row"><b>☾</b><span>대기 화면<small>잠금·절전</small></span></button><section><h3>현재 화면</h3><label>배경 이미지<input id="background" type="file" accept="image/png,image/jpeg,image/webp"></label><label>맞춤<select id="fit"><option value="cover">화면 채우기</option><option value="contain">전체 보기</option><option value="stretch">늘이기</option></select></label></section><section id="dynamic"><h3>자동 버튼 영역</h3><label>소스<select id="region-source"></select></label><label>키 번호<input id="region-keys" placeholder="2, 3, 4"></label><button id="save-region">영역 저장</button></section></aside>
<section class="stage"><div class="stage-head"><div><small id="crumb">페이지 / 홈</small><h1 id="title">버튼이 놓일 화면을 만드세요</h1></div><span>480 × 272 미리보기</span></div><div class="device"><div class="device-label">STREAM DECK · 5 × 3</div><div id="canvas" class="canvas"></div></div><p class="hint">배경은 한 장으로 렌더링됩니다. 키 사이의 간격까지 같은 좌표계를 사용합니다.</p><section class="motion"><h2>움직임</h2><div class="motion-grid"><label>페이지 전환<select id="page-motion"><option value="crossfade">크로스페이드</option><option value="fade-through-black">검정으로 페이드</option><option value="none">없음</option></select></label><label>잠금 해제<select id="unlock-motion"><option value="crossfade">크로스페이드</option><option value="fade-through-black">검정으로 페이드</option><option value="none">없음</option></select></label><label>재연결<select id="reconnect-motion"><option value="crossfade">크로스페이드</option><option value="fade-through-black">검정으로 페이드</option><option value="none">없음</option></select></label></div></section></section>
<aside class="inspector"><div class="inspector-title"><span class="spark">✦</span><div><h2 id="key-title">버튼 1</h2><small>선택한 키</small></div></div><label>버튼 종류<select id="button-type"><option value="empty">배경만 표시</option><option value="app">앱 실행</option><option value="open">웹사이트 열기</option><option value="text">텍스트</option></select></label><div id="button-fields"><label>이름<input id="button-label" placeholder="Firefox"></label><label id="bundle-label">앱 Bundle ID<input id="button-value" placeholder="org.mozilla.firefox"></label><label>아이콘<input id="icon" type="file" accept="image/png,image/jpeg,image/webp"></label><label>버튼 표시 <output id="opacity-value">0%</output><input id="opacity" type="range" min="0" max="100" value="0"></label><p>0%로 두면 배경 위에 완전히 투명한 버튼으로 동작합니다.</p></div><div class="position"><span>위치</span><b id="position">1행 1열 · 키 1</b></div></aside></main>
<script type="module" src="/app.js"></script></body></html>
