<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Streamhub Studio</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/icon-library.css"></head>
<body>
  <header>
    <div class="brand"><span class="brand-mark">S</span><strong>Streamhub</strong><b>Studio</b></div>
    <div class="workspace">작업 공간 <small>Stream Deck 5×3</small></div>
    <div class="header-spacer"></div><div class="runtime"><i id="runtime-dot"></i><span id="runtime">Runtime 확인 중</span></div><span id="state">불러오는 중</span>
    <button id="undo" class="header-button" title="실행 취소">↶</button><button id="redo" class="header-button" title="다시 실행">↷</button><button id="apply" class="primary" disabled>장치에 적용</button>
  </header>
  <div id="error" role="alert" hidden></div>
  <main>
    <aside class="pane pages-pane">
      <div class="pane-title"><div><b>화면</b><small>페이지와 대기 화면</small></div><button id="add-page" title="페이지 추가">＋</button></div>
      <nav id="pages"></nav>
    </aside>
    <aside id="action-pane" class="pane action-pane">
      <div class="pane-title"><div><b>동작</b><small>클릭하거나 키로 끌기</small></div></div>
      <label class="search"><span>⌕</span><input id="action-search" type="search" placeholder="동작 검색"></label>
      <div id="actions"></div>
    </aside>
    <section class="stage">
      <div class="surface-bar">
        <div><small id="surface-description">키 전체에 이어지는 배경을 설정합니다.</small><h1 id="surface-title">홈</h1></div>
        <div class="surface-controls"><label>배경<input id="background-file" type="file" accept="image/png,image/jpeg,image/webp"></label><label>맞춤<select id="background-fit"><option value="cover">채우기</option><option value="contain">전체 보기</option><option value="stretch">늘이기</option></select></label><label>바탕색<input id="surface-color" type="color" value="#05070a"></label></div>
      </div>
      <div id="page-settings" class="page-settings"><label>페이지 이름<input id="page-name"></label><label class="check"><input id="default-page" type="checkbox"> 기본 페이지</label></div>
      <div class="device-shell"><div class="device-top"><span>STREAM DECK</span><small>5 × 3 CANVAS</small></div><div id="canvas" class="canvas" aria-label="Stream Deck 캔버스"></div></div>
      <p class="canvas-help">배경은 하나의 480×272 화면으로 합성됩니다. 점선은 편집할 때만 보입니다.</p>
      <details class="motion"><summary>화면 전환 설정</summary><div><label>페이지 전환<select id="page-motion"><option value="crossfade">크로스페이드</option><option value="fade-through-black">검정으로 페이드</option><option value="none">없음</option></select></label><label>잠금 해제<select id="unlock-motion"><option value="crossfade">크로스페이드</option><option value="fade-through-black">검정으로 페이드</option><option value="none">없음</option></select></label><label>재연결<select id="reconnect-motion"><option value="crossfade">크로스페이드</option><option value="fade-through-black">검정으로 페이드</option><option value="none">없음</option></select></label></div></details>
    </section>
    <aside id="inspector" class="pane inspector"></aside>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
